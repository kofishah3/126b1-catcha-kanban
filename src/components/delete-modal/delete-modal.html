<h2 id="delete-modal-title" class="font-heading m-0">
    Confirm Deletion
</h2>

<p id="delete-modal-message" class="text-sm text-muted">
    Are you sure you want to delete this item?
</p>

<div class="modal-actions">
    <button
    id="cancel-delete"
    class="modal-actions__button modal-actions__button--cancel"
    >
        Cancel
    </button>
    <button
        id="confirm-delete"
        class="modal-actions__button modal-actions__button--danger"
    >
        Delete
    </button>
</div>
